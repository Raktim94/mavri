# Mavri — Single-container setup
# Both ports (3000 backend, 3001 frontend) are exposed from the same container.
#
# Start:  docker compose -f docker-compose.standalone.yml up -d
# Stop:   docker compose -f docker-compose.standalone.yml down

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    container_name: nodedr-invoice
    ports:
      - '${HOST_PORT:-3001}:3001'
    environment:
      - SERVICE=all
      - NODE_ENV=docker
      - DB_DIRECTORY=/data
      - PORT=3000
      - DEV_SERVER_URL=0.0.0.0
      - FE_SERVER_URL=http://localhost:3001
      - MIGRATIONS_PATH=/app/dist-be/backend/server/shared/migrations
      - BACKEND_HOST=localhost
      - BACKEND_PORT=3000
    volumes:
      - nodedr-invoice-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net=require('net');const c=net.createConnection(3000,'localhost');c.on('connect',()=>{c.destroy();process.exit(0)});c.on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  nodedr-invoice-data:
