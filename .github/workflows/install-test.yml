name: Install tests

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'scripts/quickstart.sh'
      - 'install.sh'
      - '.github/workflows/install-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: .deb install, update, remove and purge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot && packaging/deb/build.sh "$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)" amd64
      - name: Dependencies resolve on a clean Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" ubuntu:24.04 sh -c \
            'apt-get update -qq && apt-get install -s -y /d/mavri_*_amd64.deb | grep -E "^Inst (docker.io|docker-compose-v2|mavri)"'
      - name: Install (Docker is already on the runner)
        run: sudo dpkg -i --force-depends dist/mavri_*_amd64.deb
      - name: Service is enabled and serves Mavri
        run: |
          systemctl is-enabled mavri
          systemctl is-active mavri
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/ && ok=1 && break; sleep 3; done
          [ "${ok:-}" = 1 ] || { sudo docker logs mavri || true; exit 1; }
          curl -fsS http://127.0.0.1:3001/ | head -c 200
      - name: Restart keeps the service up
        run: |
          sudo systemctl restart mavri
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:3001/ && exit 0; sleep 3; done
          exit 1
      - name: mavri-update
        run: sudo mavri-update
      - name: Remove stops Mavri and keeps the data volume
        run: |
          sudo apt-get remove -y mavri
          test -z "$(sudo docker ps -aq --filter name=^mavri$)"
          test ! -e /lib/systemd/system/mavri.service
          sudo docker volume inspect mavri_mavri-data >/dev/null
          test -e /etc/mavri/mavri.env
      - name: Purge removes the package files but keeps your settings
        run: |
          sudo apt-get purge -y mavri
          test -e /etc/mavri/mavri.env
          test ! -e /usr/lib/mavri
      - name: Reinstall works after purge
        run: |
          sudo dpkg -i --force-depends dist/mavri_*_amd64.deb
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/ && exit 0; sleep 3; done
          exit 1
      - name: Final clean-up
        run: sudo apt-get purge -y mavri && sudo docker volume rm mavri_mavri-data && sudo rm -rf /etc/mavri

  one-line-installer:
    name: One-line installer (scripts/quickstart.sh)
    runs-on: ubuntu-24.04
    steps:
      - name: Run the installer exactly as the website shows it
        env:
          HOST_PORT: '3001'
        run: curl -fsSL https://raw.githubusercontent.com/Raktim94/mavri/main/scripts/quickstart.sh | bash
      - name: Mavri answers
        run: |
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/ && exit 0; sleep 3; done
          docker ps -a; docker logs mavri || true; exit 1
      - name: Re-running is safe
        run: curl -fsSL https://raw.githubusercontent.com/Raktim94/mavri/main/scripts/quickstart.sh | bash
      - name: Delete (stop and remove)
        run: |
          cd mavri && docker compose down -v
          test -z "$(docker ps -aq --filter name=^mavri$)"
