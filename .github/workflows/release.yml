name: Manual Release (Linux)

on:
  workflow_dispatch:   

permissions:
  contents: write

jobs:
  linux:
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Linux release
        run: npm run release:linux
