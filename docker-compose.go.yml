# Mavri with the Go backend — a single container serving the app and the API.
# Start:  docker compose -f docker-compose.go.yml up -d --build
# Stop:   docker compose -f docker-compose.go.yml down
#
# It opens the same /data/invoice.db the Node version used, as long as that
# database was last opened by the current Node version (all migrations applied).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.go
    container_name: mavri
    ports:
      - '${HOST_PORT:-3001}:3001'
    environment:
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # 0: clients connect directly. Set 1 when a reverse proxy (nginx, Caddy,
      # Cloudflare Tunnel) sits in front, so rate limits see the real client.
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Pin the key that protects e-commerce webhook secrets (32+ characters,
      # or 64 hex characters). Without it one is generated in the data volume.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - mavri-data:/data
    restart: unless-stopped

volumes:
  mavri-data:
