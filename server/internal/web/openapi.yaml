openapi: 3.0.3
info:
  title: Mavri API
  version: 1.0.0
  description: |
    REST API of a self-hosted Mavri. Amounts are integers in minor units (cents). Dates are `YYYY-MM-DD`.

    **Authentication.** Send an API key made in Settings as `Authorization: Bearer mvr_…`. Endpoints marked
    *person only* need a signed-in user (the web app) and refuse API keys: they send mail, change
    credentials or restore data.

    **Errors** always look like `{"error": {"code": "validation", "message": "…", "problems": []}}` with codes
    `validation`, `unauthorized`, `forbidden`, `not_found`, `conflict`, `rate_limited`, `internal`.

    **Idempotency.** Send an `Idempotency-Key` header on `POST /api/v1/orders`, `POST /api/documents`, `POST /api/documents/{id}/issue`, `POST /api/documents/{id}/corrections` and `POST /api/documents/{id}/follow-ups`: the request is carried out once, and sending it again with the same key returns the first answer with `Idempotent-Replay: true`. The same key with a different request answers `422`. Keys are kept for a day.

    **Rate limits.** Each API key may make 600 calls a minute. Every answer carries `X-RateLimit-Limit` and `X-RateLimit-Remaining`; beyond the limit the answer is `429` with `Retry-After`.

    **Lists** are paged with `limit` (max 1000) and `offset` and answer `{items, total, limit, offset}`.

    **Versioning.** `/api/v1/*` paths are stable: fields are only added, never removed or renamed. Other paths
    serve the web app and may change between releases (the changelog says when).
servers:
  - url: http://localhost:3001
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key from Settings → API keys.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            problems: { type: array, items: { type: string } }
    Line:
      type: object
      required: [name, quantity, unitCents]
      properties:
        name: { type: string }
        unit: { type: string }
        quantity: { type: number }
        unitCents: { type: integer }
        taxRate: { type: number, description: percent }
        taxMode: { type: string, enum: ['', add, included] }
    Payment:
      type: object
      required: [amountCents, paidOn]
      properties:
        amountCents: { type: integer }
        paidOn: { type: string, format: date }
        method: { type: string }
        note: { type: string }
    Totals:
      type: object
      properties:
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        surchargeCents: { type: integer }
        shippingCents: { type: integer }
        taxCents: { type: integer }
        totalCents: { type: integer }
    Document:
      type: object
      required: [kind, issuerId, customerId, currencyId, issuedOn, lines]
      properties:
        id: { type: integer, readOnly: true }
        kind: { type: string, enum: [invoice, quote] }
        fullNumber: { type: string, readOnly: true }
        number: { type: string, description: 'leave empty for the next number' }
        issuerId: { type: integer }
        customerId: { type: integer }
        currencyId: { type: integer }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        status: { type: string, enum: [unpaid, partial, paid, void, open, accepted, declined] }
        lines: { type: array, items: { $ref: '#/components/schemas/Line' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        totals: { $ref: '#/components/schemas/Totals' }
        paidCents: { type: integer, readOnly: true }
    Summary:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        fullNumber: { type: string }
        customerName: { type: string }
        issuedOn: { type: string }
        dueOn: { type: string }
        status: { type: string }
        currencyCode: { type: string }
        totalCents: { type: integer }
        paidCents: { type: integer }
    Party:
      type: object
      required: [kind, name]
      properties:
        id: { type: integer, readOnly: true }
        kind: { type: string, enum: [issuer, customer] }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        taxId: { type: string }
        country: { type: string, description: two-letter code }
        noReminders: { type: boolean, description: never send this customer automatic payment reminders }
    WebhookEvent:
      type: object
      description: Body of every webhook delivery.
      properties:
        id: { type: string, example: evt_9f2c… }
        type: { type: string, example: invoice.paid }
        createdAt: { type: string, format: date-time }
        data: { type: object }
    ImportReport:
      type: object
      properties:
        kind: { type: string }
        dryRun: { type: boolean }
        total: { type: integer }
        valid: { type: integer }
        created: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              message: { type: string }
              raw: { type: array, items: { type: string } }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    limit:
      name: limit
      in: query
      schema: { type: integer, maximum: 1000, default: 200 }
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /api/v1/documents:
    get:
      summary: List invoices and quotes
      tags: [Documents]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [invoice, quote] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: number or customer name }
        - { name: customerId, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: A page of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Summary' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/v1/documents/{id}:
    get:
      summary: Get one document
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          {
            description: The document,
            content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders:
    post:
      summary: Create an invoice from an order
      description: Add `?dryRun=1` to see the invoice the order would become (customer found or created, lines, totals, warnings such as tax charged twice) without writing anything. The same order id is only ever turned into one invoice.
      tags: [Documents]
      parameters:
        - { name: dryRun, in: query, schema: { type: string, enum: ['1'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId: { type: integer }
      responses:
        '201': { description: Created }
        '200': { description: Already received (duplicate order id) }
  /api/documents:
    post:
      summary: Create an invoice or quote
      tags: [Documents]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
      responses:
        '201':
          { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/documents/{id}:
    put:
      summary: Replace a document
      description: Payments in the body replace the stored payments; the status of an invoice follows them.
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete a document
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Deleted }
  /api/documents/{id}/duplicate:
    post:
      summary: Copy a document with the next number and today's date
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '201': { description: Created }
  /api/documents/{id}/convert:
    post:
      summary: Turn a quote into an invoice
      tags: [Documents]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '201': { description: The new invoice }
  /api/documents/{id}/einvoice:
    get:
      summary: UBL or XRechnung XML
      tags: [Documents]
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: format, in: query, schema: { type: string, enum: [ubl, xrechnung] } }
      responses:
        '200': { description: XML, content: { application/xml: {} } }
        '422': { description: Details the format needs are missing (see problems) }
  /api/documents/{id}/share:
    get:
      summary: The secure client link, if there is one
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: '`{link: {url, token, views, …} | null}`' }
    post:
      summary: Create (or return) the secure client link
      description: The link opens a read-only page; clients can print it as PDF and accept or decline quotes.
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: The link }
    delete:
      summary: Revoke the link
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Revoked }
  /api/documents/{id}/email/preview:
    post:
      summary: Render the email without sending it
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [send, reminder] }
                to: { type: string }
                subject: { type: string }
                body: { type: string }
      responses:
        '200': { description: '`{to, subject, body, link, configured}`' }
  /api/documents/{id}/email:
    post:
      summary: Email the document as a secure link (person only)
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [send, reminder] }
                to: { type: string }
                subject: { type: string }
                body:
                  {
                    type: string,
                    description: 'placeholders: {{customer}} {{number}} {{total}} {{balance}} {{due}} {{when}} {{link}} {{business}}'
                  }
      responses:
        '200': { description: Sent }
        '409': { description: Email is not set up }
        '502': { description: The mail server refused it }
  /api/documents/{id}/mail:
    get:
      summary: Email log of one document
      tags: [Sharing and email]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Log rows }
  /api/public/documents/{token}:
    get:
      summary: What a client sees through a secure link (no sign-in)
      security: []
      tags: [Client link]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The document without internal notes or attachments }
        '404': { description: The link is wrong or revoked }
  /api/public/documents/{token}/respond:
    post:
      summary: Accept or decline a quote, or tell the sender about an invoice (no sign-in)
      description: For a quote, `accept` or `decline`. For an invoice, `dispute` (needs a `message`) or `promise` (needs a `date`) records a follow-up for the sender. It changes no amount and marks nothing paid.
      security: []
      tags: [Client link]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, decline, dispute, promise] }
                message: { type: string, maxLength: 500 }
                date: { type: string, description: 'YYYY-MM-DD, for a promise' }
      responses:
        '200': { description: The updated quote }
        '409': { description: Already answered }
  /api/attention:
    get:
      summary: Unpaid invoices that need a person today
      description: Most urgent first. Each item has a reason (`disputed`, `broken_promise`, `delivery_failed`, `overdue`, `due_soon`, `partial`, `promised`) and a suggested next step. Invoices whose reminders are paused are left out and counted in `snoozed`.
      tags: [Collections]
      responses:
        '200': { description: '`{items, counts, snoozed}`' }
  /api/documents/{id}/follow-ups:
    get:
      summary: What was agreed with the client about this invoice
      tags: [Collections]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Follow-ups, newest first }
    post:
      summary: Record a promise to pay, a dispute, a pause on reminders or a note
      description: A dispute, a pause or a promise that is not yet due stops automatic reminders for the invoice. Nothing is sent and no fee is added. Emits `payment.promised` or `dispute.opened`.
      tags: [Collections]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [promise, dispute, snooze, note] }
                dueOn: { type: string, description: 'YYYY-MM-DD; required for promise and snooze' }
                amountCents: { type: integer }
                note: { type: string, description: Required for dispute and note }
      responses:
        '201': { description: Recorded }
        '400': { $ref: '#/components/responses/Error' }
  /api/follow-ups/{id}/resolve:
    post:
      summary: Close a follow-up (a dispute settled, a pause ended)
      tags: [Collections]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: The follow-up, now resolved }
  /api/documents/{id}/payment-options:
    get:
      summary: How the client can pay what is still owed
      description: UPI (India, INR) and SEPA (EUR with an IBAN) options carry a QR `payload` to encode; a bank transfer is listed whenever bank details exist. A payment QR only opens the client's banking app; scanning it never marks an invoice paid, and it is not a tax authority's signed e-invoice code.
      tags: [Payments]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: A list of options }
  /api/public/documents/{token}/payment-options:
    get:
      summary: The same options, for the client link
      security: []
      tags: [Client link]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: A list of options }
  /api/tax/packs:
    get:
      summary: The tax guidance Mavri has
      description: Each pack lists its status (`beta`, `estimate`), source, version, whether a person has reviewed it, what it covers and what it does not, and the rates in force on `?date=`.
      tags: [Tax]
      parameters: [{ name: date, in: query, schema: { type: string }, description: 'YYYY-MM-DD; default today' }]
      responses:
        '200': { description: Packs }
  /api/tax/explain:
    post:
      summary: Which tax usually applies to a sale, and why
      description: Guidance only. It decides nothing, applies no rate and stores nothing. The answer lists the facts it used, the facts missing, and what a person must decide.
      tags: [Tax]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuerCountry: { type: string }
                issuerTaxId: { type: string }
                customerCountry: { type: string }
                customerTaxId: { type: string }
                customerTaxExempt: { type: boolean }
                date: { type: string }
      responses:
        '200': { description: The explanation }
  /api/tax/validate:
    get:
      summary: Read a tax registration number
      description: Checks the shape (and the check characters for India and the UK). It does not prove the number is registered.
      tags: [Tax]
      parameters:
        - { name: country, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: '`{valid, kind, level, message, state}`' }
  /api/documents/{id}/issue:
    post:
      summary: Issue a draft invoice (locks it)
      description: Once issued, an invoice's figures, parties, dates, number, notes and look can no longer change; only payments and voiding can. Drafts are created with `status` `draft`. Emits `invoice.issued`. Safe to retry with an `Idempotency-Key`.
      tags: [Lifecycle]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: The issued invoice }
        '400': { $ref: '#/components/responses/Error' }
  /api/documents/{id}/corrections:
    get:
      summary: The credit and debit notes against an invoice
      tags: [Lifecycle]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Summaries of the notes }
    post:
      summary: Issue a credit note or a debit note against an issued invoice
      description: A credit note (`kind` `credit`, with `full` true or `credit` as a list of `{index, quantity}`) reduces what the invoice is owed and settles it when it covers it; the invoice itself is not changed. A debit note (`kind` `debit`, with `lines`) is a further invoice for extra charges. Both are issued at once and cannot be edited or deleted. Emits `credit_note.created` or `debit_note.created`.
      tags: [Lifecycle]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [credit, debit] }
                full: { type: boolean }
                credit: { type: array, items: { type: object, properties: { index: { type: integer }, quantity: { type: number } } } }
                lines: { type: array, items: { $ref: '#/components/schemas/Line' } }
                reason: { type: string }
      responses:
        '201': { description: The note }
        '400': { $ref: '#/components/responses/Error' }
  /api/users:
    get:
      summary: People with an account (owner only, person only)
      tags: [People]
      responses:
        '200': { description: Members with their role }
    post:
      summary: Add a person (owner only, person only)
      description: Roles are `owner` (everything), `staff` (records and documents; not settings, payments, backups, API keys or people) and `viewer` (read only).
      tags: [People]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string }
                password: { type: string }
                role: { type: string, enum: [owner, staff, viewer] }
      responses:
        '201': { description: Added }
  /api/users/{id}:
    put:
      summary: Change a role or reset a password (owner only, person only)
      description: A reset signs the person out everywhere. The last owner cannot be demoted or removed.
      tags: [People]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [owner, staff, viewer] }
                password: { type: string }
      responses:
        '200': { description: The member }
    delete:
      summary: Remove a person (owner only, person only)
      tags: [People]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Removed }
  /api/session/password:
    post:
      summary: Change your own password (person only)
      tags: [People]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string }
                password: { type: string }
      responses:
        '204': { description: Changed; your other sessions end }
  /api/documents/bulk:
    post:
      summary: Email, remind, mark paid or void many documents (person only)
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { type: integer }, maxItems: 200 }
                action: { type: string, enum: [email, remind, paid, void] }
      responses:
        '200': { description: '`{results: [{id, number, ok, message}], ok, failed}`' }
  /api/public/documents/{token}/options:
    get:
      summary: What the client can do with the document
      security: []
      tags: [Client link]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{pay, payAmount, einvoice: [ubl, xrechnung]}`' }
  /api/public/documents/{token}/pay:
    post:
      summary: Start a Stripe Checkout for the balance
      security: []
      tags: [Client link]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{url}` — send the client there' }
        '409': { description: Nothing to pay or online payment is off }
        '502': { description: Stripe refused (the message says why) }
  /api/public/documents/{token}/einvoice:
    get:
      summary: Download the e-invoice XML
      security: []
      tags: [Client link]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [ubl, xrechnung] } }
      responses:
        '200': { description: XML, content: { application/xml: {} } }
  /api/payments/config:
    get:
      summary: Online payment (Stripe) settings and the webhook address to give Stripe (person only)
      tags: [Payments]
      responses:
        '200': { description: Settings without secrets }
    put:
      summary: Save the Stripe keys and switch online payment on or off (person only)
      tags: [Payments]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                secretKey: { type: string, description: 'sk_… or rk_…; empty keeps the saved one' }
                webhookSecret: { type: string, description: 'whsec_…; empty keeps the saved one' }
      responses:
        '200': { description: Saved }
  /api/hooks/stripe:
    post:
      summary: Stripe's webhook
      description: Signed with `Stripe-Signature`; each event is applied once, the currency is checked, and a payment is added to the invoice.
      security: []
      tags: [Payments]
      responses:
        '200': { description: Received }
        '400': { description: Bad signature }
  /api/recurring:
    get:
      summary: Recurring invoice schedules
      tags: [Automation]
      responses:
        '200': { description: Schedules }
    post:
      summary: Repeat an invoice on a schedule
      tags: [Automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, every, startOn]
              properties:
                documentId: { type: integer, description: the invoice to copy }
                every: { type: string, enum: [week, month, quarter, year] }
                interval: { type: integer, default: 1 }
                startOn: { type: string, format: date, description: date of the first invoice }
                endOn: { type: string, format: date }
                autoSend: { type: boolean }
      responses:
        '201': { description: Created }
  /api/recurring/preview:
    post:
      summary: Preview a schedule before creating it
      tags: [Automation]
      responses:
        '200': { description: Upcoming dates and the invoice that would be copied }
  /api/recurring/{id}:
    put:
      summary: Pause, resume or change the end date
      tags: [Automation]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Saved }
    delete:
      summary: Stop a schedule (invoices already issued stay)
      tags: [Automation]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Deleted }
  /api/recurring/{id}/preview:
    get:
      summary: The next invoices a schedule will issue
      tags: [Automation]
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: n, in: query, schema: { type: integer, default: 6 } }
      responses:
        '200': { description: Upcoming dates and the invoice being copied }
  /api/overdue:
    get:
      summary: Unpaid invoices past their due date
      tags: [Automation]
      responses:
        '200': { description: Oldest first }
  /api/automation:
    get:
      summary: Reminder schedule and rules
      tags: [Automation]
      responses:
        '200': { description: Settings }
    put:
      summary: Change reminders and rules (person only)
      tags: [Automation]
      responses:
        '200': { description: Saved }
  /api/activity:
    get:
      summary: Activity history
      description: Who changed what, when, and from where (`ui`, `api`, `mcp`, `public`, `webhook`, `system`).
      tags: [Activity]
      parameters:
        - { name: source, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: A page of entries }
  /api/activity.csv:
    get:
      summary: Export the history as CSV (person only)
      tags: [Activity]
      responses:
        '200': { description: CSV, content: { text/csv: {} } }
  /api/webhooks:
    get:
      summary: Webhook endpoints and the event names (person only)
      tags: [Webhooks]
      responses:
        '200': { description: Endpoints }
    post:
      summary: Add an endpoint (person only)
      description: |
        The response contains the signing secret **once**. Each delivery is a POST with the headers
        `Mavri-Event`, `Mavri-Event-Id`, `Mavri-Delivery` and `Mavri-Signature: t=<unix>,v1=<hex>` where `v1`
        is the HMAC-SHA256 of `"<t>.<raw body>"` with the secret. Reject deliveries whose `t` is older than a few
        minutes. A non-2xx answer is retried after 1 min, 5 min, 30 min, 2 h and 6 h, then marked failed; use
        replay to send it again.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                description: { type: string }
                events:
                  {
                    type: array,
                    items: { type: string },
                    description: 'empty means all, e.g. ["invoice.paid", "quote.accepted"]'
                  }
      responses:
        '201': { description: '`{endpoint, secret}`' }
  /api/webhooks/{id}:
    put:
      summary: Change an endpoint (person only)
      tags: [Webhooks]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Saved }
    delete:
      summary: Remove an endpoint and its log (person only)
      tags: [Webhooks]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: Deleted }
  /api/webhooks/{id}/test:
    post:
      summary: Send a `ping` event (person only)
      tags: [Webhooks]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '202': { description: Queued }
  /api/webhooks/deliveries:
    get:
      summary: Delivery log (person only)
      tags: [Webhooks]
      parameters:
        - { name: endpointId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
      responses:
        '200': { description: Deliveries, newest first }
  /api/webhooks/deliveries/{id}/replay:
    post:
      summary: Send a past delivery again (person only)
      tags: [Webhooks]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '202': { description: Queued as a new delivery with the same event id }
  /api/export/{file}:
    get:
      summary: Export CSV (customers, products, invoices, payments, lines, journal) or every document as JSON (documents.json)
      description: '`documents.json` holds every invoice and quote exactly as the API returns it, with the business, customer, bank, currency and style as they were when each was saved.'
      tags: [CSV]
      parameters:
        [
          {
            name: file,
            in: path,
            required: true,
            schema: { type: string, enum: [customers.csv, products.csv, invoices.csv, payments.csv, lines.csv, journal.csv, documents.json] }
          }
        ]
      responses:
        '200': { description: CSV (UTF-8 with BOM) or JSON, content: { text/csv: {}, application/json: {} } }
  /api/import/{kind}:
    post:
      summary: Import customers, products or invoices from CSV (person only)
      description: Send `multipart/form-data` with a `file`. Add `?dryRun=1` to validate without writing; the report lists every row with a problem, with its line number.
      tags: [CSV]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [customers, products, invoices] } }
        - { name: dryRun, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          {
            description: Report,
            content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } }
          }
  /api/backups:
    get:
      summary: Backup status, history and what a backup contains (person only)
      tags: [Backups]
      responses:
        '200': { description: Status }
  /api/backups/config:
    put:
      summary: Schedule, retention, encryption and S3 destination (person only)
      tags: [Backups]
      responses:
        '200': { description: Saved }
  /api/backups/run:
    post:
      summary: Take a backup now (person only)
      tags: [Backups]
      responses:
        '200': { description: '`{name}`' }
  /api/backups/verify:
    post:
      summary: Open a backup and count what it holds, without restoring (person only)
      tags: [Backups]
      responses:
        '200': { description: Row counts per table }
  /api/backups/restore:
    post:
      summary: Replace the business data with a backup (person only)
      description: Needs `?confirm=replace`. A safety backup of the current data is taken first.
      tags: [Backups]
      parameters: [{ name: confirm, in: query, required: true, schema: { type: string, enum: [replace] } }]
      responses:
        '204': { description: Restored }
  /api/admin/health:
    get:
      summary: Database, storage, backup age, webhook and email failures, recent errors (person only)
      tags: [Operations]
      responses:
        '200': { description: Health report }
  /api/health:
    get:
      summary: Liveness
      security: []
      tags: [Operations]
      responses:
        '200': { description: '`{status: ok}`' }
  /api/openapi.yaml:
    get:
      summary: This document
      security: []
      tags: [Operations]
      responses:
        '200': { description: OpenAPI 3 }
